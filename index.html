<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Теңсіздіктер әлемі</title>
<style>
:root{--v:#C9A5FF;--y:#FFE58A;--p:#FFA8D0;--cr:#FFF8EF;--tx:#503477;--bg:#F4E9FF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Arial Rounded MT Bold","Nunito","Trebuchet MS",Verdana,sans-serif;color:var(--tx);min-height:100vh;
background:var(--bg) repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg,rgba(201,165,255,.12) 0 4px,transparent 4px 8px)}
main{max-width:1100px;margin:auto;padding:10px 12px 24px}
.knit{position:relative;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 3px,transparent 3px 6px),repeating-linear-gradient(0deg,rgba(80,52,119,.05) 0 3px,transparent 3px 6px)}
.knit::after{content:"";position:absolute;inset:5px;border:3px dashed rgba(255,255,255,.9);border-radius:inherit;pointer-events:none}
.v{background-color:var(--v)}.y{background-color:var(--y)}.p{background-color:var(--p)}
header{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0}
header svg{width:clamp(34px,7vw,56px);flex:none}
h1{font-size:clamp(22px,5vw,44px);text-align:center;letter-spacing:.5px;text-shadow:2px 2px 0 #fff}
.scores{position:sticky;top:0;z-index:10;display:flex;gap:8px;padding:8px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.sc{flex:1;border-radius:24px;padding:10px 4px;text-align:center;font-size:clamp(13px,2.6vw,20px);box-shadow:0 5px 0 rgba(80,52,119,.25),0 8px 14px rgba(80,52,119,.2)}
.sc b{display:block;font-size:1.7em;line-height:1.1}
.sc.up{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.08)}}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:10px}
.panel{border-radius:34px;padding:18px 16px 20px;box-shadow:0 7px 0 rgba(80,52,119,.25),0 12px 20px rgba(80,52,119,.2)}
.panel h2{text-align:center;font-size:clamp(20px,3vw,26px);margin-bottom:12px;position:relative;z-index:1}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative;z-index:1}
.cell{position:relative;aspect-ratio:1;border:none;border-radius:50%;font:inherit;font-weight:900;font-size:clamp(20px,4.2vw,32px);color:var(--tx);cursor:pointer;
background:radial-gradient(circle at 35% 28%,#fff,var(--cr) 55%,#efe0cd);box-shadow:0 6px 0 #d3bfa6,0 10px 12px rgba(80,52,119,.25),inset 0 -4px 6px rgba(0,0,0,.06);transition:transform .12s,box-shadow .12s}
.cell::before{content:"";position:absolute;inset:6px;border:2.5px dashed rgba(80,52,119,.22);border-radius:50%}
.cell span{position:relative}
.cell:not(:disabled):hover{transform:translateY(-3px)}
.cell.press{animation:press .35s}
@keyframes press{40%{transform:translateY(6px);box-shadow:0 0 0 #d3bfa6}}
.cell:disabled{cursor:default}
.cell.ok{background:radial-gradient(circle at 35% 28%,#f4fff0,#d6f3cf 60%,#b8e2ae)}
.cell.no{background:radial-gradient(circle at 35% 28%,#f2f0f4,#dcd8e0 60%,#c6c1cc);color:#7b7388}
.cell i{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:50%;font-style:normal;font-size:14px;line-height:24px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.cell.ok i{color:#e0a800}.cell.no i{color:#9a90a8}
.bar{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:22px}
.bar svg{width:clamp(40px,8vw,60px)}
.btn{position:relative;border:none;border-radius:30px;padding:14px 26px;min-height:52px;font:inherit;font-size:clamp(16px,3.5vw,20px);font-weight:900;color:var(--tx);cursor:pointer;
box-shadow:0 6px 0 rgba(80,52,119,.35),0 9px 12px rgba(80,52,119,.2);transition:transform .12s,box-shadow .12s;margin:4px}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 rgba(80,52,119,.35)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(80,52,119,.5)}
.modal.on{display:flex}
.card{width:min(560px,100%);max-height:94vh;overflow:auto;border-radius:36px;padding:26px 20px;text-align:center;background-color:var(--cr);box-shadow:0 8px 0 rgba(80,52,119,.35),0 16px 30px rgba(0,0,0,.3);animation:pop .3s}
.card>*{position:relative;z-index:1}
.card::after{border-color:rgba(201,165,255,.8)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.hd{font-size:clamp(16px,3.6vw,20px);font-weight:900;display:inline-block;padding:6px 18px;border-radius:20px;margin-bottom:8px}
.q{font-size:clamp(17px,3.6vw,20px);margin:4px 0}
.task{font-family:"Cambria Math","Segoe UI Symbol","DejaVu Sans",Georgia,serif;font-size:clamp(26px,7vw,42px);font-weight:700;margin:8px 0 12px;padding:12px 8px;background:#fff;border-radius:22px;box-shadow:inset 0 3px 8px rgba(80,52,119,.15);overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin:6px 0}
.opt{font-family:"Cambria Math","Segoe UI Symbol","DejaVu Sans",Georgia,serif;font-size:clamp(20px,5vw,28px);font-weight:700;text-align:left;padding:12px 18px;min-height:56px;border-radius:22px;border:4px solid #e4d6f7;background:#fff;color:var(--tx);cursor:pointer;box-shadow:0 5px 0 #d8c8ee;transition:transform .12s,border-color .12s,box-shadow .12s}
.opt.sel{border-color:#8a5cf0;transform:translateY(-3px);box-shadow:0 8px 0 #c9a5ff,0 0 16px rgba(138,92,240,.55)}
.opt.good{border-color:#4caf50;background:#e6f8e1;box-shadow:0 5px 0 #a9d9a0}
.opt.bad{border-color:#e57ca4;background:#ffe3ee;box-shadow:0 5px 0 #efb0c8}
.opt:disabled{cursor:default}
#msg{font-size:clamp(18px,4vw,24px);font-weight:900;margin:10px 0 4px}
#ex{font-family:"Cambria Math","Segoe UI Symbol","DejaVu Sans",Georgia,serif;font-size:clamp(16px,3.6vw,19px);background:#fff;border-radius:18px;padding:10px 12px;margin:8px 0;line-height:1.5}
.fl{position:fixed;z-index:60;pointer-events:none;font-weight:900;animation:fly 1.4s forwards}
@keyframes fly{to{transform:translate(var(--dx,0),-150px) scale(1.5) rotate(40deg);opacity:0}}
#final .cup{width:clamp(90px,24vw,150px);margin:0 auto;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 6px #ffd23f)}to{filter:drop-shadow(0 0 22px #ffb400);transform:scale(1.06)}}
#win{font-size:clamp(24px,6vw,40px);font-weight:900;margin:8px 0;text-shadow:2px 2px 0 #fff}
.row{border-radius:18px;padding:8px 10px;margin:6px 0;font-size:clamp(15px,3.6vw,19px);font-weight:900}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;display:none}
@media(max-width:820px){.board{grid-template-columns:1fr}.panel{padding:16px 12px 18px}}
</style>
</head>
<body>
<main>
<header><svg id="d1" viewBox="0 0 64 64"></svg><h1>🧮 Теңсіздіктер әлемі 🌟</h1><svg id="d2" viewBox="0 0 64 64"></svg></header>
<div class="scores" id="scores"></div>
<div class="board" id="board"></div>
<div class="bar"><svg id="d3" viewBox="0 0 64 64"></svg><button class="btn knit p" onclick="finish(true)">🏁 Ойынды аяқтау</button><svg id="d4" viewBox="0 0 64 64"></svg></div>
</main>

<div class="modal" id="modal"><div class="card knit">
<div class="hd knit" id="hd"></div>
<div class="q">Теңсіздікті шеш:</div>
<div class="task" id="task"></div>
<div class="q">Төмендегі жауаптардың біреуін таңда:</div>
<div class="opts" id="opts"></div>
<div id="msg"></div><div id="ex" style="display:none"></div>
<button class="btn knit y" id="back" onclick="closeM()">⬅ Ойын алаңына оралу</button>
<button class="btn knit v" id="chk" onclick="check()" disabled>Жауабын тексеру</button>
<button class="btn knit p" id="nxt" style="display:none" onclick="nextCell()">Келесі ұяшық ➡</button>
</div></div>

<div class="modal" id="final"><div class="card knit">
<div class="cup" id="cup"></div>
<div id="win"></div><div id="rows"></div>
<button class="btn knit y" id="cont" onclick="$('final').classList.remove('on');$('cv').style.display='none';stopB=true">Ойынды жалғастыру</button>
<button class="btn knit p" onclick="restart()">🔄 Қайта бастау</button>
</div></div>
<canvas id="cv"></canvas>

<script>
// ===== Деректер: [шарты, айнымалы, бағыт, сан, қатаң(1)/қатаң емес(0), жиі қате сан, түсіндірме] =====
const GR=[{n:'1-топ',e:'🟣',c:'v'},{n:'2-топ',e:'🟡',c:'y'},{n:'3-топ',e:'🩷',c:'p'}];
const T=[[
['x + 5 > 10','x','>',5,1,15,'Екі жақтан 5-ті азайтамыз:<br>x > 10 − 5<br>x > 5'],
['x + 11 ≤ 27','x','<',16,0,38,'Екі жақтан 11-ді азайтамыз:<br>x ≤ 27 − 11<br>x ≤ 16'],
['x − 1000 ≥ 152','x','>',1152,0,-848,'Екі жаққа 1000-ды қосамыз:<br>x ≥ 152 + 1000<br>x ≥ 1152'],
['15 − x ≤ 12','x','>',3,0,27,'−x ≤ 12 − 15 = −3<br>Екі жағын −1-ге көбейткенде белгі өзгереді:<br>x ≥ 3'],
['2x > 4','x','>',2,1,8,'Екі жағын 2-ге бөлеміз:<br>x > 4 : 2<br>x > 2'],
['−5x > 20','x','<',-4,1,4,'Екі жағын −5-ке бөлеміз, белгі өзгереді:<br>x < 20 : (−5)<br>x < −4'],
['7x < 14','x','<',2,1,98,'Екі жағын 7-ге бөлеміз:<br>x < 14 : 7<br>x < 2'],
['5(x + 3) ≥ 125','x','>',22,0,28,'Екі жағын 5-ке бөлеміз: x + 3 ≥ 25<br>x ≥ 25 − 3<br>x ≥ 22']
],[
['y + 10 > 70','y','>',60,1,80,'Екі жақтан 10-ды азайтамыз:<br>y > 70 − 10<br>y > 60'],
['2 + x < 25','x','<',23,1,27,'Екі жақтан 2-ні азайтамыз:<br>x < 25 − 2<br>x < 23'],
['10 − x > 7','x','<',3,1,17,'−x > 7 − 10 = −3<br>Екі жағын −1-ге көбейткенде белгі өзгереді:<br>x < 3'],
['x − 1 ≥ 73','x','>',74,0,72,'Екі жаққа 1-ді қосамыз:<br>x ≥ 73 + 1<br>x ≥ 74'],
['4x ≥ 24','x','>',6,0,96,'Екі жағын 4-ке бөлеміз:<br>x ≥ 24 : 4<br>x ≥ 6'],
['−3x > 9','x','<',-3,1,3,'Екі жағын −3-ке бөлеміз, белгі өзгереді:<br>x < 9 : (−3)<br>x < −3'],
['0,2x > 5','x','>',25,1,1,'Екі жағын 0,2-ге бөлеміз:<br>x > 5 : 0,2<br>x > 25'],
['3(3x + 1) ≥ 21','x','>',2,0,3,'Екі жағын 3-ке бөлеміз: 3x + 1 ≥ 7<br>3x ≥ 6<br>x ≥ 2']
],[
['22 + x > 33','x','>',11,1,55,'Екі жақтан 22-ні азайтамыз:<br>x > 33 − 22<br>x > 11'],
['x − 85 < 125','x','<',210,1,40,'Екі жаққа 85-ті қосамыз:<br>x < 125 + 85<br>x < 210'],
['100 − x < 31','x','>',69,1,131,'−x < 31 − 100 = −69<br>Екі жағын −1-ге көбейткенде белгі өзгереді:<br>x > 69'],
['41 − y < 17','y','>',24,1,58,'−y < 17 − 41 = −24<br>Екі жағын −1-ге көбейткенде белгі өзгереді:<br>y > 24'],
['4x > 16','x','>',4,1,64,'Екі жағын 4-ке бөлеміз:<br>x > 16 : 4<br>x > 4'],
['−8x < 40','x','>',-5,1,5,'Екі жағын −8-ге бөлеміз, белгі өзгереді:<br>x > 40 : (−8)<br>x > −5'],
['0,25x ≥ −4','x','>',-16,0,-1,'Екі жағын 0,25-ке бөлеміз:<br>x ≥ −4 : 0,25<br>x ≥ −16'],
['5x + 3(2x − 5) ≤ 4(12 − x) − 3','x','<',4,0,8,'Жақшаны ашамыз: 11x − 15 ≤ 45 − 4x<br>15x ≤ 60<br>x ≤ 4']
]];
const L='ABCD';
const fmt=(v,d,n,s)=>v+' '+(d=='>'?(s?'>':'≥'):(s?'<':'≤'))+' '+String(n).replace('-','−');
// Әр есептің 4 нұсқасын жасау: дұрыс жауаптың орны әртүрлі, қателер – жиі кездесетін қателер
const P=T.map((g,gi)=>g.map((t,i)=>{
 const [txt,v,d,n,s,n2,ex]=t,right=fmt(v,d,n,s),opp=d=='>'?'<':'>';
 const wr=[fmt(v,opp,n,s),fmt(v,d,n,s?0:1),fmt(v,d,n2,s)];
 const pos=(i*3+gi)%4,o=[];let k=0;
 for(let j=0;j<4;j++)o.push(j==pos?right:wr[k++]);
 return{group:gi,num:i+1,txt,opts:o,ans:pos,ex};
}));
// ===== Күй =====
let sc,used,cur,done;
const $=id=>document.getElementById(id);
function init(){sc=[0,0,0];used=GR.map(()=>Array(8).fill(null));done=0;cur=null;stopB=true;$('cv').style.display='none';$('final').classList.remove('on');$('modal').classList.remove('on');draw(true)}
function draw(all,bump){
 $('scores').innerHTML=GR.map((g,i)=>`<div class="sc knit ${g.c}${bump===i?' up':''}">${g.e} ${g.n}<b>${sc[i]}</b>ұпай</div>`).join('');
 $('board').innerHTML=GR.map((g,gi)=>`<div class="panel knit ${g.c}"><h2>${g.e} ${g.n}</h2><div class="cells">`+
 used[gi].map((u,i)=>`<button class="cell ${u===null?'':u?'ok':'no'}" ${u===null?'':'disabled'} onclick="openC(${gi},${i},this)"><span>${i+1}</span>${u===null?'':u?'<i>★</i>':'<i>✕</i>'}</button>`).join('')+`</div></div>`).join('');
}
function openC(g,i,el){
 if(used[g][i]!==null)return;
 el.classList.add('press');
 setTimeout(()=>{
  cur={g,i,sel:-1,checked:false};const p=P[g][i];
  $('hd').className='hd knit '+GR[g].c;$('hd').textContent=GR[g].e+' '+GR[g].n+' | № '+p.num+' есеп';
  $('task').textContent=p.txt;
  $('opts').innerHTML=p.opts.map((o,j)=>`<button class="opt" onclick="pick(${j})">${L[j]}) ${o}</button>`).join('');
  $('msg').textContent='';$('ex').style.display='none';
  $('chk').style.display='';$('chk').disabled=true;$('back').style.display='';$('nxt').style.display='none';
  $('modal').classList.add('on');
 },180);
}
function pick(j){
 if(!cur||cur.checked)return;
 cur.sel=j;[...document.querySelectorAll('.opt')].forEach((b,k)=>b.classList.toggle('sel',k==j));$('chk').disabled=false;
}
function closeM(){if(cur&&!cur.checked){$('modal').classList.remove('on');cur=null}}
function check(){
 if(!cur||cur.checked||cur.sel<0)return;
 const{g,i}=cur;if(used[g][i]!==null)return; // ұпайды қайталамау
 const p=P[g][i],ok=cur.sel===p.ans;
 cur.checked=true;used[g][i]=ok;done++;
 const bs=[...document.querySelectorAll('.opt')];
 bs.forEach((b,k)=>{b.disabled=true;b.classList.remove('sel');if(k==p.ans)b.classList.add('good');else if(k==cur.sel)b.classList.add('bad')});
 if(ok){sc[g]+=10;$('msg').style.color='#2e8b3a';$('msg').innerHTML='🎉 Жарайсың! Дұрыс жауап!<br>+10 ұпай! ⭐';burst()}
 else{$('msg').style.color='#c2417a';$('msg').innerHTML='💜 Бұл жолы дұрыс болмады!<br>Дұрыс жауап: '+L[p.ans]+') '+p.opts[p.ans]}
 $('ex').innerHTML=p.txt+'<br>'+p.ex;$('ex').style.display='';
 $('chk').style.display='none';$('back').style.display='none';$('nxt').style.display='';
 draw(false,ok?g:-1);
}
function burst(){
 const c=['#FFE58A','#FFA8D0','#C9A5FF','#8fd694'];
 for(let k=0;k<14;k++){const e=document.createElement('div');e.className='fl';e.textContent=k%3?'★':'●';
  e.style.cssText=`left:${40+Math.random()*20}%;top:${45+Math.random()*10}%;color:${c[k%4]};font-size:${18+Math.random()*16}px;--dx:${(Math.random()-.5)*300}px;animation-delay:${Math.random()*.2}s`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}
}
function nextCell(){$('modal').classList.remove('on');cur=null;if(done>=24)finish(false)}
function finish(ask){
 if(ask&&!confirm('Ойынды аяқтауға сенімдісіз бе?'))return;
 $('modal').classList.remove('on');cur=null;
 const mx=Math.max(...sc),w=GR.filter((g,i)=>sc[i]===mx).map(g=>g.n.toUpperCase());
 $('win').innerHTML=w.length==1?'🏆 ЖЕҢІМПАЗ — '+w[0]+'!<br>ҚҰТТЫҚТАЙМЫЗ! 🎉':'🏆 ЖЕҢІМПАЗДАР — '+w.join(', ')+'!<br>ҚҰТТЫҚТАЙМЫЗ! 🎉';
 $('rows').innerHTML=GR.map((g,i)=>`<div class="row knit ${g.c}">${g.e} ${g.n}: ${sc[i]} ұпай · дұрыс жауап: ${used[i].filter(u=>u===true).length}/8</div>`).join('');
 $('cont').style.display=done>=24?'none':'';
 $('final').classList.add('on');confetti();
}
function restart(){init()}
let stopB=true;
function confetti(){
 const c=$('cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.style.display='block';stopB=false;
 const cl=['#C9A5FF','#FFE58A','#FFA8D0','#8fd694','#fff'];
 const P2=Array.from({length:130},(_,i)=>({x:Math.random()*c.width,y:-Math.random()*c.height,vx:Math.random()-.5,vy:1.5+Math.random()*2.5,r:5+Math.random()*5,c:cl[i%5],a:Math.random()*6}));
 (function loop(){
  if(stopB)return;x.clearRect(0,0,c.width,c.height);
  P2.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.05;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}
   x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
  requestAnimationFrame(loop)})();
}
// ===== Безендіру (SVG, жіп стилі) =====
const st='stroke="#fff" stroke-width="2.5" stroke-dasharray="4 3"';
$('d1').innerHTML=`<circle cx="32" cy="32" r="28" fill="#C9A5FF" ${st}/><g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"><path d="M9 26q22 12 46-4M8 40q24 14 49-7M17 13q18 16 33 3"/></g>`;
$('d2').innerHTML=`<path d="M32 56C8 38 6 20 18 14c7-3 13 1 14 7 1-6 7-10 14-7 12 6 10 24-14 42z" fill="#FFA8D0" ${st}/>`;
$('d3').innerHTML=`<circle cx="16" cy="16" r="10" fill="#E8C39E"/><circle cx="48" cy="16" r="10" fill="#E8C39E"/><circle cx="32" cy="35" r="24" fill="#E8C39E" ${st}/><ellipse cx="32" cy="43" rx="10" ry="8" fill="#FFF8EF"/><circle cx="24" cy="30" r="3" fill="#503477"/><circle cx="40" cy="30" r="3" fill="#503477"/><ellipse cx="32" cy="40" rx="3.5" ry="2.5" fill="#503477"/>`;
$('d4').innerHTML=`<polygon points="32,4 40,24 62,26 45,40 50,60 32,49 14,60 19,40 2,26 24,24" fill="#FFE58A" ${st}/>`;
$('cup').innerHTML=`<svg viewBox="0 0 64 64"><path d="M18 12H8c0 12 4 18 12 20M46 12h10c0 12-4 18-12 20" stroke="#E5A800" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M16 6h32v18c0 13-7 21-16 21S16 37 16 24z" fill="#FFD23F" stroke="#fff" stroke-width="2" stroke-dasharray="4 3"/><rect x="28" y="44" width="8" height="9" fill="#E5A800"/><rect x="19" y="52" width="26" height="7" rx="3" fill="#FFD23F" stroke="#E5A800" stroke-width="2"/><polygon points="32,12 34.5,19 42,19.5 36,24 38,31 32,27 26,31 28,24 22,19.5 29.5,19" fill="#fff" opacity=".85"/></svg>`;
